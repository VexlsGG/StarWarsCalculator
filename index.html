<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Themed Calculator</title>
    <link rel="stylesheet" href="Codes/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
    
    <!-- Add CSP meta tag -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self';">

</head>
<body class="jedi-theme">

    <div class="container">
        <div class="flex-container">
            <div class="calculator">
                <form>
                    <div class="display">
                        <input type="text" name="display" readonly>
                    </div>
                    <div>
                        <input type="button" value="AC" onclick="document.querySelector('input[name=display]').value = ''" class="operator">
                        <input type="button" value="DE" onclick="document.querySelector('input[name=display]').value = document.querySelector('input[name=display]').value.slice(0, -1)" class="operator">
                        <input type="button" value="." onclick="document.querySelector('input[name=display]').value += '.'" class="operator">
                        <input type="button" value="/" onclick="document.querySelector('input[name=display]').value += '/'" class="operator">
                    </div>
                    <div>
                        <input type="button" value="7" onclick="document.querySelector('input[name=display]').value += '7'">
                        <input type="button" value="8" onclick="document.querySelector('input[name=display]').value += '8'">
                        <input type="button" value="9" onclick="document.querySelector('input[name=display]').value += '9'">
                        <input type="button" value="*" onclick="document.querySelector('input[name=display]').value += '*'" class="operator">
                    </div>
                    <div>
                        <input type="button" value="4" onclick="document.querySelector('input[name=display]').value += '4'">
                        <input type="button" value="5" onclick="document.querySelector('input[name=display]').value += '5'">
                        <input type="button" value="6" onclick="document.querySelector('input[name=display]').value += '6'">
                        <input type="button" value="-" onclick="document.querySelector('input[name=display]').value += '-'" class="operator">
                    </div>
                    <div>
                        <input type="button" value="1" onclick="document.querySelector('input[name=display]').value += '1'">
                        <input type="button" value="2" onclick="document.querySelector('input[name=display]').value += '2'">
                        <input type="button" value="3" onclick="document.querySelector('input[name=display]').value += '3'">
                        <input type="button" value="+" onclick="document.querySelector('input[name=display]').value += '+'" class="operator">
                    </div>
                    <div>
                        <input type="button" value="00" onclick="document.querySelector('input[name=display]').value += '00'">
                        <input type="button" value="0" onclick="document.querySelector('input[name=display]').value += '0'">
                        <input type="button" id="equal-button" value="=" onclick="evaluateExpression()">
                        <button type="button" id="copy-button" onclick="copyToClipboard()">Copy</button>
                    </div>
                </form>
            </div>
            <div class="history-panel" id="history">
                <!-- History content will be dynamically added here -->
            </div>
        </div>

        <!-- Theme Toggle Button -->
        <button type="button" class="switch-theme-button" onclick="toggleTheme()">Toggle Theme</button>
    </div>

            <!-- Button to manually clear history -->
        <button type="button" class="clear-history-button">Clear History</button>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle"></button>

    <!-- Mobile Menu -->
    <div class="mobile-menu">
        <ul>
            <li><a href="#" class="toggle-history">Show History</a></li>
            <li><a href="#" class="toggle-theme">Toggle Theme</a></li>
        </ul>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="Codes/script.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
